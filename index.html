<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dream – Manifestation</title>

<style>
:root{
  --bg: linear-gradient(180deg,#0f1023,#1b1d3a);
  --card: rgba(255,255,255,0.08);
  --accent:#c7b8ff;
  --text:#fff;
  --muted:#b6b6d8;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
  padding:16px;
}
h1{text-align:center;margin:6px 0}
.subtitle{text-align:center;color:var(--muted);font-size:.9rem}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  max-width:500px;
  margin:24px auto;
}
.card{
  background:var(--card);
  padding:18px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
}

.screen{display:none;max-width:500px;margin:0 auto}
.aff{
  font-size:1.3rem;
  line-height:1.4;
  white-space:pre-line;
  margin:16px 0;
}
.tap{
  background:radial-gradient(circle,#c7b8ff33,#c7b8ff11);
  border-radius:14px;
  padding:12px;
  text-align:center;
  cursor:pointer;
}
.count{color:var(--muted);font-size:.85rem;margin-top:4px}

textarea{
  width:100%;
  padding:10px;
  margin-top:12px;
  border-radius:12px;
  background:#ffffff11;
  border:none;
  color:#fff;
}
button{
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--accent);
  background:none;
  color:var(--accent);
  cursor:pointer;
}

.list{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.row{
  background:var(--card);
  border-radius:14px;
  padding:12px;
}
.actions{display:flex;gap:8px;margin-top:8px}
.small{flex:1;padding:6px;border-radius:10px;text-align:center;background:#ffffff11;cursor:pointer}
.delete{color:#ff9b9b}

.history{
  margin-top:14px;
  font-size:.75rem;
  color:var(--muted);
  white-space:pre-line;
}
.challenge{margin-top:10px;color:var(--accent);font-size:.85rem}
</style>
</head>

<body>

<h1>Dream</h1>
<div class="subtitle">Tap to affirm ✨</div>

<div class="grid" id="home">
  <div class="card" onclick="openTheme('Wealth')">💸 Wealth</div>
  <div class="card" onclick="openTheme('Love')">💗 Love</div>
  <div class="card" onclick="openTheme('Career')">💼 Career</div>
  <div class="card" onclick="openTheme('Confidence')">✨ Confidence</div>
  <div class="card" onclick="openTheme('Growth')">🌱 Growth</div>
  <div class="card" onclick="openTheme('Rampages')">💥 Rampages</div>
</div>

<div class="screen" id="screen">
  <div class="aff" id="aff"></div>
  <div class="tap" id="tap" onclick="tapRotate()">Tap</div>
  <div class="count" id="count"></div>

  <textarea id="input" placeholder="Add affirmation or rampage"></textarea>
  <button onclick="add()">Add</button>
  <button onclick="toggle()">Switch Mode</button>

  <div class="challenge" id="challenge"></div>
  <div class="list" id="list"></div>
  <div class="history" id="history"></div>

  <button onclick="back()">Back</button>
</div>

<script>
const DAILY_GOAL = 50;
const today = () => new Date().toISOString().slice(0,10);

let data = JSON.parse(localStorage.getItem("data")) || {
  Wealth:[], Love:[], Career:[], Confidence:[], Growth:[], Rampages:[]
};
let history = JSON.parse(localStorage.getItem("history")) || {};
let theme="", index=0, mode="scroll";

function save(){
  localStorage.setItem("data",JSON.stringify(data));
  localStorage.setItem("history",JSON.stringify(history));
}

function openTheme(t){
  theme=t;
  index=0;
  mode="scroll";
  document.getElementById("home").style.display="none";
  document.getElementById("screen").style.display="block";
  render();
}

function toggle(){
  mode = mode==="scroll" ? "rotate" : "scroll";
  render();
}

function tap(i){
  const d=today();
  history[d]=history[d]||{};
  history[d][theme]=history[d][theme]||[];
  history[d][theme][i]=(history[d][theme][i]||0)+1;
  save();
  render();
}

function tapRotate(){
  tap(index);
  index=(index+1)%data[theme].length;
}

function add(){
  const v=document.getElementById("input").value.trim();
  if(!v) return;
  data[theme].push(v);
  document.getElementById("input").value="";
  save();
  render();
}

function del(i){
  data[theme].splice(i,1);
  save();
  render();
}

function render(){
  const aff=document.getElementById("aff");
  const tapBtn=document.getElementById("tap");
  const count=document.getElementById("count");
  const list=document.getElementById("list");
  const hist=document.getElementById("history");
  const chal=document.getElementById("challenge");

  list.innerHTML="";
  aff.style.display=tapBtn.style.display=count.style.display =
    mode==="rotate" ? "block" : "none";

  if(mode==="rotate"){
    aff.textContent=data[theme][index]||"Add an affirmation below";
    count.textContent=`${getCount(index)} taps today`;
  }

  if(mode==="scroll"){
    data[theme].forEach((t,i)=>{
      const r=document.createElement("div");
      r.className="row";
      r.innerHTML=`
        <div>${t}</div>
        <div class="actions">
          <div class="small" onclick="tap(${i})">Tap</div>
          <div class="small delete" onclick="del(${i})">Delete</div>
        </div>
        <div class="count">${getCount(i)} taps today</div>
      `;
      list.appendChild(r);
    });
  }

  const total = (history[today()]?.[theme]||[]).reduce((a,b)=>a+b,0);
  chal.textContent = `Daily goal: ${DAILY_GOAL} • Remaining: ${Math.max(DAILY_GOAL-total,0)}`;

  hist.textContent = (history[today()]?.[theme]||[])
    .map((v,i)=>`#${i+1}: ${v} taps`).join("\n") || "No history yet";
}

function getCount(i){
  return history[today()]?.[theme]?.[i]||0;
}

function back(){
  document.getElementById("screen").style.display="none";
  document.getElementById("home").style.display="grid";
}
</script>

</body>
</html>
