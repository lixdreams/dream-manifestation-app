<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream – Manifestation</title>

<style>
:root{
  --bg: linear-gradient(180deg,#0f1023,#1b1d3a);
  --card: rgba(255,255,255,0.08);
  --accent:#c7b8ff;
  --text:#fff;
  --muted:#b6b6d8;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
  padding:16px;
}
h1{text-align:center;margin:6px 0}
.subtitle{text-align:center;color:var(--muted);font-size:.9rem}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  max-width:500px;
  margin:24px auto;
}
.card{
  background:var(--card);
  padding:18px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
}

.screen{display:none;max-width:500px;margin:0 auto}

.aff{
  font-size:1.3rem;
  line-height:1.4;
  white-space:pre-line;
  margin:16px 0;
}

.tap{
  background:radial-gradient(circle,#c7b8ff33,#c7b8ff11);
  border-radius:14px;
  padding:12px;
  text-align:center;
  cursor:pointer;
  user-select:none;
}

.count{color:var(--muted);font-size:.85rem;margin-top:4px}

textarea{
  width:100%;
  padding:10px;
  margin-top:12px;
  border-radius:12px;
  background:#ffffff11;
  border:none;
  color:#fff;
}

button{
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--accent);
  background:none;
  color:var(--accent);
  cursor:pointer;
}

.list{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.row{
  background:var(--card);
  border-radius:14px;
  padding:12px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.small{
  flex:1;
  padding:6px;
  border-radius:10px;
  text-align:center;
  background:#ffffff11;
  cursor:pointer;
}

.delete{color:#ff9b9b}

.history{
  margin-top:14px;
  font-size:.75rem;
  color:var(--muted);
  white-space:pre-line;
}

.challenge{
  margin-top:10px;
  color:var(--accent);
  font-size:.85rem;
}
</style>
</head>

<body>

<h1>Dream</h1>
<div class="subtitle">Tap to affirm ✨</div>

<div class="grid" id="home">
  <div class="card" data-theme="Wealth">💸 Wealth</div>
  <div class="card" data-theme="Love">💗 Love</div>
  <div class="card" data-theme="Career">💼 Career</div>
  <div class="card" data-theme="Confidence">✨ Confidence</div>
  <div class="card" data-theme="Growth">🌱 Growth</div>
  <div class="card" data-theme="Rampages">💥 Rampages</div>
</div>

<div class="screen" id="screen">
  <div class="aff" id="aff"></div>
  <div class="tap" id="tapBtn">Tap</div>
  <div class="count" id="count"></div>

  <textarea id="input" placeholder="Add affirmation or rampage"></textarea>
  <button id="addBtn">Add</button>
  <button id="modeBtn">Switch Mode</button>

  <div class="challenge" id="challenge"></div>
  <div class="list" id="list"></div>
  <div class="history" id="history"></div>

  <button id="backBtn">Back</button>
</div>

<script>
const DAILY_GOAL = 50;
const today = () => new Date().toISOString().slice(0,10);

let data = JSON.parse(localStorage.getItem("data")) || {
  Wealth:[], Love:[], Career:[], Confidence:[], Growth:[], Rampages:[]
};

let history = JSON.parse(localStorage.getItem("history")) || {};
let theme = "", index = 0, mode = "scroll";

const home = document.getElementById("home");
const screen = document.getElementById("screen");
const aff = document.getElementById("aff");
const tapBtn = document.getElementById("tapBtn");
const count = document.getElementById("count");
const list = document.getElementById("list");
const historyEl = document.getElementById("history");
const challengeEl = document.getElementById("challenge");

function save(){
  localStorage.setItem("data", JSON.stringify(data));
  localStorage.setItem("history", JSON.stringify(history));
}

home.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click",()=>{
    theme = card.dataset.theme;
    index = 0;
    mode = "scroll";
    home.style.display="none";
    screen.style.display="block";
    render();
  });
});

function toggleMode(){
  mode = mode === "scroll" ? "rotate" : "scroll";
  render();
}

function tapAffirm(i){
  const d = today();
  history[d] = history[d] || {};
  history[d][theme] = history[d][theme] || [];
  history[d][theme][i] = (history[d][theme][i] || 0) + 1;
  save();
  render();
}

tapBtn.addEventListener("click",()=>{
  if(!data[theme].length) return;
  tapAffirm(index);
  index = (index + 1) % data[theme].length;
});

function render(){
  list.innerHTML = "";

  if(mode === "rotate"){
    aff.style.display = tapBtn.style.display = count.style.display = "block";
    aff.textContent = data[theme][index] || "Add an affirmation below";
    count.textContent = `${getCount(index)} taps today`;
  } else {
    aff.style.display = tapBtn.style.display = count.style.display = "none";
    data[theme].forEach((text,i)=>{
      const row = document.createElement("div");
      row.className = "row";

      const textDiv = document.createElement("div");
      textDiv.textContent = text;

      const actions = document.createElement("div");
      actions.className = "actions";

      const tap = document.createElement("div");
      tap.className = "small";
      tap.textContent = "Tap";
      tap.addEventListener("click",()=>tapAffirm(i));

      const del = document.createElement("div");
      del.className = "small delete";
      del.textContent = "Delete";
      del.addEventListener("click",()=>{
        data[theme].splice(i,1);
        save();
        render();
      });

      actions.appendChild(tap);
      actions.appendChild(del);

      const c = document.createElement("div");
      c.className = "count";
      c.textContent = `${getCount(i)} taps today`;

      row.appendChild(textDiv);
      row.appendChild(actions);
      row.appendChild(c);
      list.appendChild(row);
    });
  }

  const total = (history[today()]?.[theme]||[]).reduce((a,b)=>a+b,0);
  challengeEl.textContent = `Daily goal: ${DAILY_GOAL} • Remaining: ${Math.max(DAILY_GOAL-total,0)}`;

  historyEl.textContent =
    (history[today()]?.[theme]||[]).map((v,i)=>`#${i+1}: ${v} taps`).join("\n") || "No history yet";
}

function getCount(i){
  return history[today()]?.[theme]?.[i] || 0;
}

document.getElementById("addBtn").addEventListener("click",()=>{
  const v = document.getElementById("input").value.trim();
  if(!v) return;
  data[theme].push(v);
  document.getElementById("input").value="";
  save();
  render();
});

document.getElementById("modeBtn").addEventListener("click", toggleMode);
document.getElementById("backBtn").addEventListener("click",()=>{
  screen.style.display="none";
  home.style.display="grid";
});
</script>

</body>
</html>
