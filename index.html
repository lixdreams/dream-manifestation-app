<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream – Manifestation App</title>

<style>
:root{
  --bg: linear-gradient(180deg,#0f1023,#1b1d3a);
  --card: rgba(255,255,255,0.08);
  --accent:#c7b8ff;
  --text:#fff;
  --muted:#b6b6d8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
  padding:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{margin:8px 0 4px;font-weight:500}
.subtitle{color:var(--muted);font-size:.9rem}

.themes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  width:100%;
  max-width:500px;
  margin-top:24px;
}

.theme{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  text-align:center;
  cursor:pointer;
  user-select:none;
}
.theme:active{transform:scale(.96)}

.counter{
  display:none;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.affirmation{
  font-size:1.3rem;
  max-width:360px;
  line-height:1.4;
  margin:16px 0;
  white-space:pre-line;
}

.tap{
  width:120px;
  height:44px;
  border-radius:14px;
  background:radial-gradient(circle,#c7b8ff33,#c7b8ff11);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.tap:active{transform:scale(.95)}

.count{margin-top:6px;color:var(--muted);font-size:.85rem}

textarea{
  width:90%;
  max-width:380px;
  margin-top:14px;
  padding:10px;
  border-radius:10px;
  background:#ffffff11;
  border:none;
  color:#fff;
  resize:vertical;
}

button{
  margin-top:10px;
  border:1px solid var(--accent);
  background:none;
  color:var(--accent);
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer;
}

.list{
  width:100%;
  max-width:380px;
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.row{
  background:var(--card);
  padding:12px;
  border-radius:14px;
}

.row-text{white-space:pre-line}

.row-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.small-btn{
  flex:1;
  padding:6px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  background:#ffffff11;
}

.delete{color:#ff8b8b}

.history{
  margin-top:14px;
  font-size:.75rem;
  color:var(--muted);
  white-space:pre-line;
}

.mode{
  margin-top:10px;
  font-size:.85rem;
}
</style>
</head>

<body>

<h1>Dream</h1>
<div class="subtitle">Tap to affirm ✨</div>

<div class="themes" id="themes">
  <div class="theme" onclick="openTheme('Wealth')">💸 Wealth</div>
  <div class="theme" onclick="openTheme('Love')">💗 Love</div>
  <div class="theme" onclick="openTheme('Career')">💼 Career</div>
  <div class="theme" onclick="openTheme('Confidence')">✨ Confidence</div>
  <div class="theme" onclick="openTheme('Growth')">🌱 Growth</div>
  <div class="theme" onclick="openTheme('Rampages')">💥 Rampages</div>
</div>

<div class="counter" id="counter">
  <div class="affirmation" id="affirmation"></div>
  <div class="tap" id="tapBtn" onclick="tapRotate()">Tap</div>
  <div class="count" id="count"></div>

  <textarea id="input" placeholder="Add affirmation or rampage"></textarea>
  <button onclick="addAffirmation()">Add</button>

  <button id="autoBtn" onclick="addAuto()">Add Auto Affirmation</button>
  <button class="mode" onclick="toggleMode()" id="modeBtn">Switch to Rotate Mode</button>

  <div class="list" id="list"></div>
  <div class="history" id="history"></div>

  <button onclick="goBack()">Back</button>
</div>

<script>
/* ---------- HELPERS ---------- */
function normalizeTheme(t){return t.trim()}

/* ---------- DATA ---------- */
const defaults={
  Wealth:["Money flows to me easily","I am abundant"],
  Love:["I am deeply loved","Love surrounds me"],
  Career:["I succeed effortlessly","Opportunities find me"],
  Confidence:["I trust myself","I am powerful"],
  Growth:["I evolve every day","I welcome change"],
  Rampages:[]
}

const autoBank={
  Wealth:["Abundance is natural to me","Money comes from many sources"],
  Love:["I attract healthy love","I am worthy of love"],
  Career:["I thrive professionally","I am respected at work"],
  Confidence:["I radiate confidence","I believe in myself"],
  Growth:["I grow with ease","Change benefits me"]
}

let affirmations=JSON.parse(localStorage.getItem("affirmations"))||defaults
let history=JSON.parse(localStorage.getItem("history"))||{}
let theme=null,index=0,mode="scroll"

/* ---------- CORE ---------- */
function openTheme(t){
  theme=normalizeTheme(t)
  affirmations[theme]=affirmations[theme]||[]
  index=0
  mode="scroll"

  document.getElementById("themes").style.display="none"
  document.getElementById("counter").style.display="flex"
  document.getElementById("autoBtn").style.display=theme==="Rampages"?"none":"block"
  document.getElementById("modeBtn").innerText="Switch to Rotate Mode"

  render()
}

function toggleMode(){
  mode=mode==="scroll"?"rotate":"scroll"
  document.getElementById("modeBtn").innerText=
    mode==="scroll"?"Switch to Rotate Mode":"Switch to Scroll Mode"
  render()
}

function render(){
  const list=document.getElementById("list")
  const aff=document.getElementById("affirmation")
  const tap=document.getElementById("tapBtn")
  const count=document.getElementById("count")
  list.innerHTML=""

  if(mode==="scroll"){
    aff.style.display=tap.style.display=count.style.display="none"

    affirmations[theme].forEach((text,i)=>{
      const row=document.createElement("div")
      row.className="row"
      row.innerHTML=`
        <div class="row-text">${text}</div>
        <div class="row-actions">
          <div class="small-btn" onclick="tapIndex(${i})">Tap</div>
          <div class="small-btn delete" onclick="del(${i})">Delete</div>
        </div>
        <div class="count">${getCount(i)} taps today</div>
      `
      list.appendChild(row)
    })
  } else {
    aff.style.display=tap.style.display=count.style.display="block"
    aff.innerText=affirmations[theme][index]||"Add one below"
    count.innerText=`${getCount(index)} taps today`
  }

  updateHistory()
}

function tapIndex(i){
  const d=new Date().toISOString().slice(0,10)
  history[d]=history[d]||{}
  history[d][theme]=history[d][theme]||[]
  history[d][theme][i]=(history[d][theme][i]||0)+1
  localStorage.setItem("history",JSON.stringify(history))
  render()
}

function tapRotate(){
  tapIndex(index)
  index=(index+1)%affirmations[theme].length
}

function getCount(i){
  const d=new Date().toISOString().slice(0,10)
  return history[d]?.[theme]?.[i]||0
}

function del(i){
  affirmations[theme].splice(i,1)
  localStorage.setItem("affirmations",JSON.stringify(affirmations))
  render()
}

function addAffirmation(){
  const v=document.getElementById("input").value.trim()
  if(!v)return
  affirmations[theme].push(v)
  localStorage.setItem("affirmations",JSON.stringify(affirmations))
  document.getElementById("input").value=""
  render()
}

function addAuto(){
  const pool=autoBank[theme]
  if(!pool)return
  affirmations[theme].push(pool[Math.floor(Math.random()*pool.length)])
  localStorage.setItem("affirmations",JSON.stringify(affirmations))
  render()
}

function updateHistory(){
  const d=new Date().toISOString().slice(0,10)
  let txt=""
  history[d]?.[theme]?.forEach((v,i)=>txt+=`#${i+1}: ${v} taps\n`)
  document.getElementById("history").innerText=txt||"No history yet"
}

function goBack(){
  document.getElementById("counter").style.display="none"
  document.getElementById("themes").style.display="grid"
}
</script>
</body>
</html>
